# Copia de seguridad semanal de la base de datos (pg_dump) guardada como artefacto de GitHub (90 días, gratis).
name: Copia de seguridad

on:
  schedule:
    - cron: "30 12 * * 0"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Comprobar configuración
        id: cfg
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::notice::Falta el secreto DATABASE_URL; se omite la copia"; echo "ok=false" >> "$GITHUB_OUTPUT"
          else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      # pg_dump 18 puede volcar servidores 18 o anteriores (Neon usa 17 por defecto).
      - name: Instalar cliente de PostgreSQL 18
        if: steps.cfg.outputs.ok == 'true'
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-18
      - name: Volcado
        if: steps.cfg.outputs.ok == 'true'
        run: |
          URL="${DATABASE_URL/postgresql+psycopg:/postgresql:}"
          /usr/lib/postgresql/18/bin/pg_dump "$URL" --format=custom --no-owner --file=ligamx-$(date -u +%Y%m%d).dump
      - uses: actions/upload-artifact@v4
        if: steps.cfg.outputs.ok == 'true'
        with:
          name: ligamx-backup
          path: "*.dump"
          retention-days: 90
