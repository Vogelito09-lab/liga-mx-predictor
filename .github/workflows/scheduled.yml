# Tareas automáticas gratuitas. Se ejecutan en GitHub Actions contra la base de datos de Neon.
# Horarios en UTC. La Liga MX juega casi siempre entre las 17:00 y las 22:10 (hora del centro de México, UTC-6),
# es decir, entre las 23:00 y las 06:59 UTC. GitHub puede retrasar unos minutos las ejecuciones programadas.
name: Tareas programadas

on:
  schedule:
    - cron: "*/10 23 * * *"     # sincronización ligera cada 10 min en horario de partidos
    - cron: "*/10 0-6 * * *"
    - cron: "17 */6 * * *"      # sincronización completa (calendario de 3 semanas) cada 6 h
    - cron: "40 9 * * *"        # mantenimiento diario: auditoría, reentrenamiento según política, predicciones
    - cron: "5 11 * * 1"        # verificación cruzada semanal con Football-Data.co.uk
    - cron: "0 10 1 * *"        # backtesting mensual
  workflow_dispatch:
    inputs:
      task:
        description: "Tarea a ejecutar"
        required: true
        default: sync
        type: choice
        options: [live, sync, maintenance, crosscheck, backtest, backfill]

# Nunca dos tareas a la vez sobre la misma base (además del candado dentro de PostgreSQL).
concurrency:
  group: ligamx-db
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ENV: production
    steps:
      - name: Elegir tarea
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then T="${{ inputs.task }}"
          else case "${{ github.event.schedule }}" in
            "17 */6 * * *") T=sync ;;
            "40 9 * * *") T=maintenance ;;
            "5 11 * * 1") T=crosscheck ;;
            "0 10 1 * *") T=backtest ;;
            *) T=live ;;
          esac; fi
          echo "task=$T" >> "$GITHUB_OUTPUT"
          echo "Tarea: $T"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Migraciones
        run: alembic upgrade head
      - name: Ejecutar ${{ steps.pick.outputs.task }}
        run: python -m app.jobs.cli --trigger schedule ${{ steps.pick.outputs.task }}

  keepalive:
    # GitHub desactiva los cron de repositorios sin actividad durante 60 días; esto lo evita.
    if: github.event.schedule == '40 9 * * *'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            date -u +%FT%TZ > .github/keepalive
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/keepalive && git commit -m "Mantener activas las tareas programadas" && git push
          fi
