# Blueprint de Render (plan gratuito). En Render: New → Blueprint → selecciona este repositorio.
services:
  - type: web
    name: ligamx-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.1"
      - key: ENV
        value: production
      - key: DATABASE_URL
        sync: false          # pega la cadena de conexión de Neon
      - key: ADMIN_TOKEN
        generateValue: true  # Render genera un token aleatorio; cópialo desde el panel
      - key: CORS_ORIGINS
        sync: false          # URL del sitio estático, p. ej. https://ligamx-web.onrender.com

  - type: web
    name: ligamx-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false          # URL del servicio ligamx-api, p. ej. https://ligamx-api.onrender.com
